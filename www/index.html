<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.amazonaws.com; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Anmelden · Minecraft</title>
    <link rel="stylesheet" href="./login.css" />
    <script type="module" src="./login.mjs"></script>
  </head>
  <body>
    <main aria-labelledby="login-title">
      <h1 id="login-title">Minecraft Login</h1>
      <p>Melde dich mit deiner freigeschalteten E-Mail-Adresse an.</p>
      <form id="email-form">
        <label for="email">E-Mail-Adresse</label>
        <input id="email" name="email" type="email" autocomplete="username" maxlength="254" placeholder="du@beispiel.de" required disabled />
        <button type="submit" disabled>Code senden</button>
      </form>
      <form id="code-form" hidden>
        <label for="code">Code aus deiner E-Mail</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]+" maxlength="16" required disabled aria-describedby="code-help" />
        <p id="code-help" class="hint">Pruefe auch deinen Spam-Ordner.</p>
        <button type="submit" disabled>Anmelden</button>
        <button id="restart" class="secondary" type="button" disabled>Andere E-Mail / neuen Code anfordern</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true">Anmeldung wird vorbereitet ...</p>
      <noscript><p class="status">Bitte aktiviere JavaScript, um dich sicher anzumelden.</p></noscript>
    </main>
  </body>
</html>
